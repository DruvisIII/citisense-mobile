; Phone photos are often 3-8 MB; PHP's defaults (2 MB / 8 MB) reject them,
; which breaks both the Roboflow AI check and report submission.
upload_max_filesize = 20M
post_max_size = 25M
memory_limit = 256M

; Roboflow can take up to ~90 seconds with retries.
max_execution_time = 120

display_errors = Off
log_errors = On
error_log = /dev/stderr
variables_order = "EGPCS"
